[project]
name = "fabric-advisor"
version = "0.1.0"
description = "Colour and print-scale advice for unstitched Pakistani fabric"
requires-python = ">=3.11"
dependencies = [
    # Image work for fabric segmentation, tiling and colour sampling.
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
